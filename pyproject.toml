[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-rewards"
version = "0.1.0"
description = "Automate Microsoft Rewards searches on Linux and Wayland"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "MOBSAD" },
]
dependencies = [
    "customtkinter>=5.2,<6",
]

[project.urls]
Repository = "https://github.com/MOBSAD/auto-rewards"

[project.scripts]
auto-rewards = "main:main"

[project.gui-scripts]
auto-rewards-gui = "gui:main"

[tool.setuptools]
py-modules = ["main", "gui"]
